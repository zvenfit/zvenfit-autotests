name: Playwright quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autotests-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ZVENFIT_FRONTEND_PATH: ${{ github.workspace }}/zvenfit-frontend

    steps:
      - name: Checkout autotests
        uses: actions/checkout@v6
        with:
          path: zvenfit-autotests
          persist-credentials: false

      # PR #2 is paired with zvenfit-frontend#54. Pin the reviewed frontend
      # revision only for this PR; master and every future PR use main.
      - name: Checkout frontend revision
        uses: actions/checkout@v6
        with:
          repository: zvenfit/zvenfit-frontend
          ref: ${{ github.event.pull_request.number == 2 && '3726748311cdce557fd86195b9e303ac12d3e783' || 'main' }}
          path: zvenfit-frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            zvenfit-autotests/package-lock.json
            zvenfit-frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix zvenfit-autotests
          npm ci --prefix zvenfit-frontend

      - name: Build frontend test revision
        working-directory: zvenfit-frontend
        env:
          NODE_ENV: development
          ASSET_VERSION: ci-${{ github.sha }}
        run: npm run build

      - name: Install Chromium
        working-directory: zvenfit-autotests
        run: npx playwright install --with-deps chromium

      - name: Typecheck and test
        working-directory: zvenfit-autotests
        run: npm run check
