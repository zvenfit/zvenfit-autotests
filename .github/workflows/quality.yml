name: Playwright quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autotests-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ZVENFIT_FRONTEND_PATH: ${{ github.workspace }}/zvenfit-frontend

    steps:
      - name: Checkout autotests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: zvenfit-autotests
          persist-credentials: false

      # Cross-repository PRs are tested against the exact reviewed frontend
      # revision; master and unrelated PRs use main.
      - name: Checkout frontend revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zvenfit/zvenfit-frontend
          ref: ${{ github.event.pull_request.number == 2 && 'ea6d795f6797609bf2069e3a610617faef704e9b' || github.event.pull_request.number == 3 && '59f4b56d353c6071c89b154e0f2a7ccadb62529c' || 'main' }}
          path: zvenfit-frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            zvenfit-autotests/package-lock.json
            zvenfit-frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix zvenfit-autotests
          npm ci --prefix zvenfit-frontend

      - name: Build frontend test revision
        working-directory: zvenfit-frontend
        env:
          NODE_ENV: development
          ASSET_VERSION: ci-${{ github.sha }}
        run: npm run build

      - name: Install Chromium
        working-directory: zvenfit-autotests
        run: npx playwright install --with-deps chromium

      - name: Typecheck and test
        working-directory: zvenfit-autotests
        run: npm run check
