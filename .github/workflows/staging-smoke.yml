name: Reusable staging Playwright smoke

on:
  workflow_call:
    inputs:
      autotests_ref:
        description: Immutable zvenfit-autotests commit to check out
        required: true
        type: string
    secrets:
      STAGING_BASIC_AUTH_USERNAME:
        required: true
      STAGING_BASIC_AUTH_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: https://staging.zvenfit.ru
      STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}
      STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
    steps:
      - name: Checkout immutable autotests revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zvenfit/zvenfit-autotests
          ref: ${{ inputs.autotests_ref }}
          path: zvenfit-autotests
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zvenfit-autotests/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix zvenfit-autotests

      - name: Install Chromium
        working-directory: zvenfit-autotests
        run: npx playwright install --with-deps chromium

      - name: Run safe staging E2E
        working-directory: zvenfit-autotests
        run: npm run test:staging
